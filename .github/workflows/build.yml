name: Build ZinimalOS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Se pushi di nuovo sulla stessa branch, annulla la run precedente
concurrency:
  group: iso-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
      ISO_NAME: zinimalos-amd64.hybrid.iso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome artifact (senza '/')
        run: |
          suffix="$(printf '%s' '${{ github.head_ref || github.ref_name }}' | tr '/' '-')"
          echo "ART_SUFFIX=${suffix}" >> "$GITHUB_ENV"
          echo "Artifact: zinimalos-amd64-${suffix}"

      - name: Spazio disco disponibile
        run: df -h / | sed 's/^/  /'

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso isolinux \
            syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            cpio zstd xz-utils file rsync ca-certificates wget curl jq
          lb --version

      - name: Configure
        run: ./auto/config

      - name: Mostra la configurazione live-build
        run: |
          lb config --dump | grep -E "LB_(DISTRIBUTION|ARCHITECTURE|IMAGE_NAME|IMAGE_TYPE|SECURITY|DEBIAN_INSTALLER|MIRROR_BINARY)=" | sort || true

      - name: Build ISO
        run: |
          set -o pipefail
          ./auto/build 2>&1 | tee build.log

      - name: Mostra errore (annotazioni)
        if: failure()
        run: |
          # Le annotazioni ::error:: sono leggibili via API (check-runs/annotations)
          # anche quando i log completi non sono scaricabili.
          if [ -f build.log ]; then
            echo "----- ultime 40 righe di build.log -----"
            tail -n 40 build.log
            tail -n 40 build.log | while IFS= read -r line; do
              line="$(printf '%s' "$line" | cut -c1-350)"
              if [ -n "$line" ]; then
                echo "::error title=build.log::$line"
              fi
            done
          else
            echo "::error title=build.log::build.log non creato"
          fi

      - name: Commenta il log sulla PR (se fallisce)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          tail -n 200 build.log > /tmp/tail.txt || true
          jq -Rs '{body: ("### ❌ Build fallita — ultime righe di `build.log`\n\n```\n" + . + "\n```")}' \
            < /tmp/tail.txt > /tmp/body.json
          code="$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --data @/tmp/body.json || echo 000)"
          echo "HTTP $code"
          if [ "$code" != "201" ]; then
            msg="$(head -c 250 /tmp/resp.json 2>/dev/null | tr '\n' ' ')"
            echo "::error title=commento PR fallito (HTTP $code)::$msg"
          fi

      - name: Show ISO info
        run: |
          ls -lh ./*.iso || true
          sha256sum ./*.iso || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: zinimalos-amd64-${{ env.ART_SUFFIX }}
          path: ${{ env.ISO_NAME }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.ART_SUFFIX }}
          path: |
            build.log
            *.log
            *.build.log
          retention-days: 7
          if-no-files-found: ignore
