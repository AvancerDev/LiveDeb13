name: Build LiveDeb13 ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Se pushi di nuovo sulla stessa branch, annulla la run precedente
concurrency:
  group: iso-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
      ISO_NAME: livedeb13-amd64.hybrid.iso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome artifact (senza '/')
        run: |
          suffix="$(printf '%s' '${{ github.head_ref || github.ref_name }}' | tr '/' '-')"
          echo "ART_SUFFIX=${suffix}" >> "$GITHUB_ENV"
          echo "Artifact: livedeb13-amd64-${suffix}"

      - name: Spazio disco disponibile
        run: df -h / | sed 's/^/  /'

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso isolinux \
            syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            cpio zstd xz-utils file rsync ca-certificates wget
          lb --version

      - name: Configure
        run: ./auto/config

      - name: Mostra la configurazione live-build
        run: |
          lb config --dump | grep -E "LB_(DISTRIBUTION|ARCHITECTURE|IMAGE_NAME|IMAGE_TYPE|SECURITY|DEBIAN_INSTALLER|MIRROR_BINARY)=" | sort || true

      - name: Build ISO
        run: |
          set -o pipefail
          ./auto/build 2>&1 | tee build.log

      - name: Mostra errore (annotazioni)
        if: failure()
        run: |
          # Le annotazioni ::error:: sono leggibili via API (check-runs/annotations)
          # anche quando i log completi non sono scaricabili.
          if [ -f build.log ]; then
            echo "----- ultime 40 righe di build.log -----"
            tail -n 40 build.log
            tail -n 40 build.log | while IFS= read -r line; do
              line="$(printf '%s' "$line" | cut -c1-350)"
              if [ -n "$line" ]; then
                echo "::error title=build.log::$line"
              fi
            done
          else
            echo "::error title=build.log::build.log non creato"
          fi

      - name: Show ISO info
        run: |
          ls -lh ./*.iso || true
          sha256sum ./*.iso || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: livedeb13-amd64-${{ env.ART_SUFFIX }}
          path: ${{ env.ISO_NAME }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.ART_SUFFIX }}
          path: |
            build.log
            *.log
            *.build.log
          retention-days: 7
          if-no-files-found: ignore
