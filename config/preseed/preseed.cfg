# ZinimalOS — preseed per Debian Installer (modalità testuale)
# Vedi: https://wiki.debian.org/DebianInstaller/Preseed
# Questo file viene usato dall'installer live. Le voci attive impostano
# lingua/tastiera/fuso orario/mirror in italiano, ma lasciano interattivi
# partizionamento e creazione utente (per sicurezza).

# Lingua e localizzazione
d-i debian-installer/locale select it_IT.UTF-8
d-i debian-installer/language select it
d-i localechooser/supported-locales multiselect it_IT.UTF-8, en_US.UTF-8

# Tastiera
d-i keyboard-configuration/xkb-keymap select it

# Fuso orario
d-i clock-setup/utc boolean true
d-i time/zone select Europe/Rome
d-i clock-setup/ntp boolean true

# Mirror (deb.debian.org, protocollo http per compatibilità live)
d-i mirror/protocol select http
d-i mirror/country select IT
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite select trixie

# Installer in modalità testuale (niente GUI)
d-i debian-installer/skip-recommends boolean true

# Partizionamento: GUIDATO (commenta per partizionamento manuale)
# d-i partman-auto/method string regular
# d-i partman-auto/disk select /dev/sda
# d-i partman-auto/filesystem string ext4
# d-i partman-auto/choose_recipe select atomic

# Utente: interattivo di default. Per unattended, decommenta e imposta:
# d-i passwd/user-fullname string Live User
# d-i passwd/username string user
# d-i passwd/user-password password live
# d-i passwd/user-password-again password live
# d-i passwd/root-password password live
# d-i passwd/root-password-again password live
# d-i passwd/root-login boolean false

# Software: tasksel minimale (solo standard, niente desktop)
tasksel tasksel/first multiselect standard, ssh-server

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_generic boolean true
d-i grub-installer/bootloader-version string 2

# Fine installazione
d-i finish-install/reboot boolean true
